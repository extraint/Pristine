[workspace]
resolver = "2"
members = ["crates/pristine-core", "crates/pristine-cli", "crates/pristine-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/extraint/Pristine"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha1 = "0.10"
hex = "0.4"
futures = "0.3"
directories = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
md-5 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
base64 = "0.22"
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime", "system-config"] }
